version: "3.8"

services:
  app:
    image: danielbrendel/krepagotchi:latest
    ports:
      - "8080:80"
    volumes:
      - app_logs:/var/www/html/app/logs
      - app_migrate:/var/www/html/app/migrations
    environment:
      APP_TIMEZONE: "UTC"
      LOG_ENABLE: 1
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: krepagotchi
      DB_USERNAME: user
      DB_PASSWORD: password
      DB_CHARSET: "utf8mb4"
    depends_on:
      - db

  db:
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: my-secret-pw
      MARIADB_DATABASE: krepagotchi
      MARIADB_USER: user
      MARIADB_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  app_logs:
  app_migrate:
